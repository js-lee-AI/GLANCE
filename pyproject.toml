[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glance-vlm"
version = "0.1.0"
description = "One-pass block drafting for lossless speculative decoding in vision-language models"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jungseob Lee" }]
keywords = ["speculative-decoding", "vision-language-models", "inference", "block-diffusion"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# The candidate tree and the draftability law run on numpy alone, so the
# analysis half of the package installs anywhere. Torch is pulled in only by
# the decoding extra, and imported only when a decoding entry point is touched.
dependencies = ["numpy>=1.23", "scipy>=1.10"]

[project.optional-dependencies]
decode = ["torch>=2.4", "transformers>=4.57", "pillow>=10.0", "accelerate>=0.30"]

[project.urls]
Homepage = "https://github.com/js-lee-AI/GLANCE"

[tool.setuptools.packages.find]
include = ["glance*"]
